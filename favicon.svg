<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- sky blue background -->
  <rect width="32" height="32" rx="8" fill="#daeef9"/>
  <!-- mast -->
  <line x1="16" y1="19" x2="16" y2="7" stroke="#8b6f5e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- main sail -->
  <path d="M16 8 L16 18 L24 15 Z" fill="#4a9bc8" opacity="0.85"/>
  <!-- front sail -->
  <path d="M16 9 L16 15 L10 13 Z" fill="#91c8e4" opacity="0.9"/>
  <!-- flag -->
  <path d="M16 7 L16 10 L19 8.5 Z" fill="#2a6496"/>
  <!-- deck -->
  <rect x="11" y="19" width="10" height="1.5" rx="0.5" fill="#c4a882"/>
  <!-- hull -->
  <path d="M9.5 20.5 Q10.5 24 16 24.5 Q21.5 24 22.5 20.5 Z" fill="#3a8fc4"/>
  <!-- water line -->
  <path d="M6 25.5 Q10 24 14 25.5 Q18 27 22 25.5 Q26 24 28 25.5" stroke="#91c8e4" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- sand -->
  <ellipse cx="16" cy="30" rx="14" ry="4" fill="#fdf0b0" opacity="0.5"/>
</svg>
